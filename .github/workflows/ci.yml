name: CI

# One workflow, one job: everything that can break the project is checked here, in the order a
# failure is cheapest to find. `pnpm verify` runs the first five steps locally.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # A real MongoDB for the smoke test (the build itself needs no database).
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      # pnpm must be on PATH before setup-node so that its dependency cache works.
      - name: Install pnpm
        run: npm install --global pnpm@12.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type check (TypeScript)
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      # No database or secrets are needed to build: every public page falls back to the built-in
      # placeholder content when MongoDB is not configured.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      # Starts the production server against the MongoDB service and a fake Cloudinary, then
      # exercises the real routes: automatic database setup, uploads, removal, sync, the public
      # pages. The admin session is minted with a throwaway secret generated by the script.
      - name: Smoke test (production server + MongoDB)
        run: pnpm test:smoke
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/portfolio_cms
