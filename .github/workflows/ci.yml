name: CI

# One workflow. Everything that can break the project is checked here, in the order a failure is
# cheapest to find. `pnpm verify` (or `npm run verify`) runs the first five steps locally.
#
# pnpm is the supported package manager, so it runs the complete chain. npm is checked as well,
# because anyone may clone the project and run `npm install`: it must install from its own
# lockfile and pass the same type check, lint, tests and production build.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.pm }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        pm: [pnpm, npm]

    # A real MongoDB for the smoke test (the build itself needs no database).
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      # pnpm must be on PATH before setup-node so that its dependency cache works.
      - name: Install pnpm
        if: matrix.pm == 'pnpm'
        run: npm install --global pnpm@12.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ matrix.pm }}

      # Install scripts stay off for both managers (see allowBuilds in pnpm-workspace.yaml): the
      # build needs none of them.
      - name: Install dependencies (pnpm)
        if: matrix.pm == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (npm)
        if: matrix.pm == 'npm'
        run: npm ci --ignore-scripts

      - name: Formatting (Prettier)
        run: ${{ matrix.pm }} run format:check

      - name: Lint (ESLint)
        run: ${{ matrix.pm }} run lint

      - name: Type check (TypeScript)
        run: ${{ matrix.pm }} run typecheck

      - name: Unit tests (Vitest)
        run: ${{ matrix.pm }} run test

      # No database or secrets are needed to build: every public page falls back to the built-in
      # placeholder content when MongoDB is not configured.
      - name: Build
        run: ${{ matrix.pm }} run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      # Starts the production server against the MongoDB service and a fake Cloudinary, then
      # exercises the real routes: automatic database setup, uploads, removal, sync, colours,
      # navigation, articles, comments, the public pages. The admin session is minted with a
      # throwaway secret generated by the script.
      - name: Smoke test (production server + MongoDB)
        run: ${{ matrix.pm }} run test:smoke
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/portfolio_cms
