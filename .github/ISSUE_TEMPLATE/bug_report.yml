name: Bug report
description: Something is broken or behaves differently from what the docs say
labels: ['problem']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Do not post secrets** (passwords, tokens, connection strings). For security problems, use the private process in SECURITY.md instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How do you run it?
      options:
        - Local (pnpm dev)
        - Vercel
        - Self-hosted (pnpm start / Docker)
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 'e.g. 22.11.0'
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant server or browser console output. Remove anything private first.
      render: shell
